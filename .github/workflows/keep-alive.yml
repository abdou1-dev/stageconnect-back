# Maintient le service Render éveillé (plan gratuit = sommeil après ~15 min
# d'inactivité, réveil 30-60 s). Crucial pendant l'évaluation du jury.
# Repo public → minutes GitHub Actions illimitées. À désactiver après la
# soutenance si besoin (Actions → Keep-alive Render → Disable workflow).
name: Keep-alive Render

on:
  schedule:
    - cron: '*/10 * * * *' # toutes les 10 minutes
  workflow_dispatch: # déclenchement manuel possible

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl -sS --max-time 90 https://stageconnect-back.onrender.com/api/health \
            && echo " <- API eveillee" \
            || echo "ping en echec (le prochain reessaiera)"
